<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Redirecting to e-Lab...</title>
    <!-- 1. Instant HTTP meta refresh -->
    <meta http-equiv="refresh" content="0; url=https://e2u.github.io/e-lab/">
    <link rel="canonical" href="https://e2u.github.io/e-lab/">
    <!-- 2. Seamless JavaScript redirect preserving query params and hash -->
    <script>
      window.location.replace("https://e2u.github.io/e-lab/" + window.location.search + window.location.hash);
    </script>
  </head>
  <body>
    <p>Redirecting to e-Lab Circuit Simulation Laboratory... If you are not redirected automatically, please click <a href="https://e2u.github.io/e-lab/">here</a>.</p>
  </body>
</html>
